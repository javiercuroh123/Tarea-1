<!doctype html>
<!-- lang="es": los lectores de pantalla usan la pronunciación correcta. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Payline · Panel de transacciones</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de pagos y transacciones construido con Angular y Supabase.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--
    Tipografía Inter desde Google Fonts.
    `preconnect` abre la conexión antes de necesitarla y `display=swap` muestra
    el texto con la fuente del sistema mientras Inter se descarga (así nunca se
    ve la página en blanco).
    Si no hay conexión, la pila de respaldo definida en _variables.scss se
    encarga del resto.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
