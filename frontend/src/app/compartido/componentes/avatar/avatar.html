<div
  class="avatar"
  [class.avatar--con-borde]="conBorde()"
  [style.width.px]="tamano()"
  [style.height.px]="tamano()"
  [style.background]="color()"
  [style.color]="colorTexto()"
  [style.font-size.px]="tamanoFuente()"
  [attr.title]="nombre()"
>
  @if (url()) {
    <img [src]="url()" [alt]="nombre()" loading="lazy" />
  } @else {
    <span aria-hidden="true">{{ textoIniciales() }}</span>
  }
</div>
