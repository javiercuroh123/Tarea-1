<!--
  Un único <svg> contenedor y dentro un @switch que elige las formas.
  `aria-hidden` porque el icono siempre acompaña a un texto o a un
  `aria-label` del botón que lo contiene: para un lector de pantalla es
  decoración y no debe leerse.
-->
<svg
  [attr.width]="tamano()"
  [attr.height]="tamano()"
  [attr.stroke-width]="grosor()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (nombre()) {
    <!-- Panel / cuadrícula -->
    @case ('cuadricula') {
      <rect x="3" y="3" width="7" height="7" rx="2" />
      <rect x="14" y="3" width="7" height="7" rx="2" />
      <rect x="3" y="14" width="7" height="7" rx="2" />
      <rect x="14" y="14" width="7" height="7" rx="2" />
    }

    <!-- Transacciones (lista) -->
    @case ('lista') {
      <line x1="9" y1="6" x2="20" y2="6" />
      <line x1="9" y1="12" x2="20" y2="12" />
      <line x1="9" y1="18" x2="20" y2="18" />
      <circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none" />
      <circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none" />
      <circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none" />
    }

    <!-- Informes (documento) -->
    @case ('documento') {
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
      <path d="M14 3v5h5" />
      <line x1="9" y1="13" x2="15" y2="13" />
      <line x1="9" y1="17" x2="13" y2="17" />
    }

    <!-- Ajustes (controles deslizantes) -->
    @case ('ajustes') {
      <line x1="4" y1="8" x2="20" y2="8" />
      <line x1="4" y1="16" x2="20" y2="16" />
      <circle cx="9" cy="8" r="2.4" />
      <circle cx="15" cy="16" r="2.4" />
    }

    <!-- Ayuda -->
    @case ('ayuda') {
      <circle cx="12" cy="12" r="9" />
      <path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2-2.4 3.4" />
      <circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none" />
    }

    <!-- Campana de notificaciones -->
    @case ('campana') {
      <path d="M18 8a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6" />
      <path d="M10.5 19a2 2 0 0 0 3 0" />
    }

    <!-- Lupa -->
    @case ('buscar') {
      <circle cx="11" cy="11" r="7" />
      <line x1="16.2" y1="16.2" x2="21" y2="21" />
    }

    <!-- Embudo de filtros -->
    @case ('filtro') {
      <path d="M3 5h18l-7 8v6l-4 2v-8z" />
    }

    <!-- Doble flecha (enviar) -->
    @case ('flechas-derecha') {
      <path d="m7 6 6 6-6 6" />
      <path d="m14 6 6 6-6 6" />
    }

    <!-- Intercambiar monedas -->
    @case ('intercambio') {
      <path d="M8 4v14" />
      <path d="m4.5 14.5 3.5 4 3.5-4" />
      <path d="M16 20V6" />
      <path d="m12.5 9.5 3.5-4 3.5 4" />
    }

    <!-- Flechas de navegación -->
    @case ('chevron-abajo') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('chevron-izquierda') {
      <path d="m15 6-6 6 6 6" />
    }
    @case ('chevron-derecha') {
      <path d="m9 6 6 6-6 6" />
    }

    <!-- Añadir -->
    @case ('mas') {
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    }

    <!-- Menú de tres puntos -->
    @case ('puntos') {
      <circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none" />
    }

    <!-- Cerrar -->
    @case ('cerrar') {
      <line x1="6" y1="6" x2="18" y2="18" />
      <line x1="18" y1="6" x2="6" y2="18" />
    }

    <!-- Marca de verificación -->
    @case ('check') {
      <path d="m5 13 4 4 10-10" />
    }

    <!-- Estado: completada -->
    @case ('check-circulo') {
      <circle cx="12" cy="12" r="9" />
      <path d="m8.5 12 2.5 2.5 4.5-5" />
    }

    <!-- Estado: pendiente -->
    @case ('reloj') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7.5V12l3 2" />
    }

    <!-- Estado: fallida -->
    @case ('x-circulo') {
      <circle cx="12" cy="12" r="9" />
      <line x1="9" y1="9" x2="15" y2="15" />
      <line x1="15" y1="9" x2="9" y2="15" />
    }

    <!-- Ordenación de columna -->
    @case ('orden') {
      <path d="m8 10 4-4 4 4" />
      <path d="m8 14 4 4 4-4" />
    }

    <!-- Eliminar -->
    @case ('papelera') {
      <path d="M4 7h16" />
      <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
      <path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    }

    <!-- Abrir en otra ventana -->
    @case ('enlace') {
      <path d="M14 4h6v6" />
      <path d="M20 4 11 13" />
      <path d="M18 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" />
    }

    <!-- Persona -->
    @case ('usuario') {
      <circle cx="12" cy="8.5" r="3.5" />
      <path d="M5 20a7 7 0 0 1 14 0" />
    }

    <!-- Gráfico de barras -->
    @case ('grafico') {
      <line x1="4" y1="20" x2="20" y2="20" />
      <rect x="6" y="11" width="3.2" height="6" rx="1" />
      <rect x="11" y="7" width="3.2" height="10" rx="1" />
      <rect x="16" y="13" width="3.2" height="4" rx="1" />
    }

    <!-- Bandeja vacía -->
    @case ('inbox') {
      <path d="M3 12h5l1.5 3h5L16 12h5" />
      <path d="M5.5 5h13l2.5 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z" />
    }
  }
</svg>
