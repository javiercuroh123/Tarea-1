<!--
  role="status" + aria-live="polite": los lectores de pantalla anuncian el
  mensaje cuando aparece, sin interrumpir lo que se estuviera leyendo.
-->
<div class="avisos" role="status" aria-live="polite">
  @for (aviso of avisos(); track aviso.id) {
    <div class="aviso" [class]="'aviso aviso--' + aviso.tipo">
      <app-icono [nombre]="icono(aviso.tipo)" [tamano]="18" />
      <p class="aviso__texto">{{ aviso.texto }}</p>

      <button
        type="button"
        class="aviso__cerrar"
        aria-label="Cerrar aviso"
        (click)="cerrar(aviso.id)"
      >
        <app-icono nombre="cerrar" [tamano]="14" />
      </button>
    </div>
  }
</div>
